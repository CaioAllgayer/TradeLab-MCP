[project]
name = "tradelab-mcp"
version = "0.1.0"
description = "Trading Research MCP — MetaTrader 5 Strategy Tester as the official backtest engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CaioAllgayer" }]
keywords = ["mcp", "metatrader", "mt5", "mql5", "backtest", "quant", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/CaioAllgayer/TradeLab-MCP"
Issues = "https://github.com/CaioAllgayer/TradeLab-MCP/issues"

[project.scripts]
tradelab-mcp = "mcp_mt5.server:main"
mcp-mt5 = "mcp_mt5.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mt5"]

[tool.hatch.build.targets.wheel.force-include]
"experts" = "mcp_mt5/experts"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real MetaTrader 5 installation",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
